name: check
on:
  push:
  pull_request:
  schedule:
  - cron: 45 4 * * 0
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DRIVER: ${{ matrix.driver }}
    strategy:
      matrix:
        ruby:
        - '2.5'
        - '2.6'
        - '2.7'
        - '3.0'
        - '3.1'
        - '3.2'
        - '3.3'
        - '3.4'
        - '4.0'
        - jruby-9.4
        - jruby-10.1
        driver:
        - git
        - rugged
        exclude:
          - ruby: jruby-9.4
            driver: rugged
          - ruby: jruby-10.1
            driver: rugged
      fail-fast: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        ruby-version: "${{ matrix.ruby }}"
        bundler-cache: true
    - run: bundle exec rspec
  benchmark:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        ruby-version: '4'
        bundler-cache: true
    - run: DRIVER=rugged bundle install --jobs=3 --retry=3
    - run: DRIVER=git bundle exec script/benchmark
    - run: DRIVER=rugged bundle exec script/benchmark
